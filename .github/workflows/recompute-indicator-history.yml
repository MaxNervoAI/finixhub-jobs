name: Recompute indicator history

# One-off, run by hand (finixhub#256): rewrites stored RSI/ATR/ADX/DI/Stochastic RSI with the
# corrected formulas. Dry run unless "write" is set to true.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'One asset (e.g. BTC); empty for all active assets'
        required: false
        default: ''
      write:
        description: 'Write to the database (false = dry run)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: recompute-indicator-history
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Recompute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYMBOL: ${{ inputs.symbol }}
          WRITE: ${{ inputs.write }}
        run: |
          ARGS=""
          [ -n "$SYMBOL" ] && ARGS="$ARGS --symbol $SYMBOL"
          [ "$WRITE" = "true" ] && ARGS="$ARGS --write"
          npx tsx scripts/recompute-indicator-history.ts $ARGS

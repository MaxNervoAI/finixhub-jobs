name: Hyperliquid Signal Trader

on:
  # Primary trigger: fires within seconds of the scanner finishing, instead of
  # a fixed cron offset that GitHub Actions can delay by hours under load.
  workflow_run:
    workflows: ["AI Trade Opportunity Scanner"]
    types: [completed]
  # Safety net: catches anything missed if the workflow_run trigger doesn't
  # fire (e.g. the scanner run itself fails) or a signal needs a second look.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger at any time

# Serialize runs — workflow_run and the schedule safety-net can fire within
# seconds of each other, and two concurrent runs both reading "current open
# positions" before either records its own new trade caused a real duplicate
# double-open (2026-07-29: same BTC + ETH signals opened twice, one from
# each overlapping run, blowing past the same-direction cap). Queue instead
# of running in parallel; never cancel a run mid-trade.
concurrency:
  group: hl-signal-trader
  cancel-in-progress: false

jobs:
  trade:
    name: Open HL trades for new aligned signals
    runs-on: ubuntu-latest
    timeout-minutes: 10  # market orders fill immediately + SL/TP placement
    # Don't trade off a scanner run that failed — only proceed if this was
    # triggered by something other than workflow_run (schedule/dispatch), or
    # by a workflow_run event whose scanner run actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run signal trader
        run: node scripts/hl-signal-trader.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HL_WALLET_ADDRESS: ${{ secrets.HL_WALLET_ADDRESS }}
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_TESTNET: ${{ secrets.HL_TESTNET }}
          HL_RISK_PER_TRADE_USD: ${{ secrets.HL_RISK_PER_TRADE_USD }}
          HL_ENTRY_TIMEOUT_MIN: '10'

      - name: Notify on failure
        if: failure()
        run: echo "Hyperliquid signal trader failed"

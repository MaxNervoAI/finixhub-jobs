name: Calculate Technical Indicators

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculate-indicators
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Calculate technical indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/calculate-technical-indicators.ts

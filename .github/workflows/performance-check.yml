name: AI Trade Performance Check

on:
  # Dispatched by Supabase pg_cron (dispatch-performance-check edge function)
  # every ~20 min, not GitHub's own `schedule:` trigger — that ran this job
  # only once a day, which meant a real Hyperliquid TP fill could sit
  # unreconciled in the DB for up to 24h (found 2026-07-31: two positions
  # had already closed profitably ~5.5h earlier with nothing to show it).
  workflow_dispatch: # Also what pg_cron calls

concurrency:
  group: performance-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run performance check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-performance-check.mjs

      - name: Run opportunity performance check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-opportunity-perf-check.mjs

      - name: Sync Hyperliquid trade outcomes
        run: node scripts/hl-sync-results.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HL_WALLET_ADDRESS: ${{ secrets.HL_WALLET_ADDRESS }}
          HL_PRIVATE_KEY: ${{ secrets.HL_PRIVATE_KEY }}
          HL_TESTNET: ${{ secrets.HL_TESTNET }}

      - name: Notify on failure
        if: failure()
        run: echo "Performance check workflow failed"

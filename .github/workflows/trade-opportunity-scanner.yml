name: AI Trade Opportunity Scanner

on:
  # Triggered by Supabase pg_cron (dispatch-trade-scanner edge function) via
  # the GitHub API every 12h, not GitHub's own `schedule:` trigger — that was
  # observed delaying by 2-3.5 hours under load, which cascaded into stale
  # signals and missed trades downstream. See supabase/migrations in the
  # main finixhub repo (schedule_trade_scanner_dispatch) for the pg_cron job.
  workflow_dispatch: # Allow manual trigger (also what pg_cron calls)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run trade scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/run-trade-scanner.mjs

      - name: Notify on failure
        if: failure()
        run: echo "Trade scanner workflow failed"

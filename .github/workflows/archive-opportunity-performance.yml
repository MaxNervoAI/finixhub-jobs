name: Archive Opportunity Performance → R2

on:
  schedule:
    # 1st of every month at 03:00 UTC — after daily pipelines have settled
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, no upload or delete)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  archive:
    name: Archive rows older than 180 days to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run archive script
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/archive-opportunity-performance.mjs --dry-run
          else
            node scripts/archive-opportunity-performance.mjs
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

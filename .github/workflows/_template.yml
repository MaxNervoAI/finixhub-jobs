name: YOUR WORKFLOW NAME

on:
  schedule:
    - cron: '0 0 * * *'   # Edit schedule — crontab.guru to verify
  workflow_dispatch:        # Always include for manual triggers
  # NEVER add: pull_request, push, fork — public repo, forks would get free CI

# ── Safety Defaults ──────────────────────────────────────────────────────────
# Minimum permissions: never grant more than needed.
# contents: write only if this job commits back to THIS repo (e.g. update-live-demo).
permissions:
  contents: read

# Prevent concurrent runs of the same workflow.
# IMPORTANT: set cancel-in-progress: false for jobs that must not be interrupted
# mid-execution (db-backup, backfill). For all others, true is correct.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    # REQUIRED: prevents runaway jobs consuming all runner time and hitting 6h ceiling.
    # Use 350 for backfill (5h 50m). Use 10-30 for most jobs.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Add AI keys only if this script calls an AI API:
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: npx tsx scripts/your-script.ts

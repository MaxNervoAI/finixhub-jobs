name: Update Live Demo Plans

on:
  schedule:
    # Run at midnight (00:00 UTC) every day
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: update-live-demo
  cancel-in-progress: false

jobs:
  update-demo-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate & Upload Demo Plans
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-demo-plans.mjs
